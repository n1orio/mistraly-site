server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Статика: хешированные имена файлов из Vite — можно кэшировать надолго.
    # Без `expires`, иначе nginx добавит второй Cache-Control рядом с нашим.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA — отдаём index.html на любой маршрут.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html кэшировать нельзя: в нём хеши бандлов.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # API — на бэкенд. Имя хоста `backend` резолвится в docker-сети `mistraly`.
    location /api/ {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}