<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <title>Breeze — Игровой проект</title>
    <script>
      // Применяем сохранённую тему до загрузки приложения, чтобы избежать белой вспышки
      try { var t = localStorage.getItem('breeze_theme'); if (t ? t === 'dark' : true) document.documentElement.classList.add('dark') } catch (e) {}
    </script>
  <style>html{zoom:1.15}img{image-rendering:pixelated;image-rendering:-moz-crisp-edges;image-rendering:crisp-edges}</style></head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
